<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Barcode Generator – Night Star Express</title>
  <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
  <style>
    :root {
      --ci-blue: #003366;
      --ci-light: #e9f1f9;
    }
    body {
      font-family: 'Segoe UI', Arial, sans-serif;
      background: white;
      color: var(--ci-blue);
      margin: 0;
      padding: 0;
      text-align: center;
    }
    header {
      background-color: var(--ci-blue);
      padding: 20px;
    }
    header img {
      max-height: 80px;
    }
    main {
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }
    input {
      width: 80%;
      max-width: 400px;
      padding: 12px;
      font-size: 18px;
      border: 2px solid var(--ci-blue);
      border-radius: 8px;
      color: var(--ci-blue);
    }
    textarea {
      width: 80%;
      max-width: 400px;
      padding: 12px;
      font-size: 18px;
      border: 2px solid var(--ci-blue);
      border-radius: 8px;
      color: var(--ci-blue);
      height: 100px;
      resize: vertical;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: var(--ci-blue);
      color: white;
      border: none;
      border-radius: 8px;
      cursor: pointer;
    }
    
    #printSection {
      background: white;
      padding: 40px;
      margin-top: 20px;
    }
    
    .barcode-container {
      display: inline-block;
      border: 3px solid #000000;
      padding: 25px 35px;
      background: white;
      text-align: center;
    }
    
    #barcode {
      margin-bottom: 10px;
    }
    
    .address-block {
      font-family: Arial, sans-serif;
      font-size: 17px;
      line-height: 1.4;
      color: #000000;
      font-weight: bold;
      margin-top: 5px;
    }
    
    .address-block div {
      margin: 2px 0;
    }
    
    .manual-note {
      margin-top: 30px;
    }
    
    @media print {
      body {
        background: white;
      }
      
      header, main > h1, main > p, main > input, main > button, .manual-note {
        display: none !important;
      }
      
      #printSection {
        position: absolute;
        top: 100px;
        left: 100px;
        padding: 0;
        background: white;
      }
      
      .barcode-container {
        page-break-inside: avoid;
        border: 3px solid #000000;
      }
    }
    
    @page {
      margin: 2cm;
    }
  </style>
</head>
<body>
  <header>
    <img src="https://github.com/nse-f/barcode/blob/main/logo-nse.svg" alt="Night Star Express Logo">
  </header>
  <main>
    <h1>Barcode Generator Night Star Express Frankfurt</h1>
    <p>Gib deinen Barcode-Text und die Adresse ein:</p>
    <input type="text" id="barcodeInput" placeholder="z.B. 116319_MDXKGE_SD" oninput="generateBarcode()" />
    
    <input type="text" id="nameInput" placeholder="Name (z.B. Stefan Eimer)" oninput="updateAddress()" />
    <input type="text" id="companyInput" placeholder="Firma (z.B. Löwen Techniker)" oninput="updateAddress()" />
    <input type="text" id="streetInput" placeholder="Straße (z.B. Bodenheimerstr. 12)" oninput="updateAddress()" />
    <input type="text" id="cityInput" placeholder="PLZ Ort (z.B. DE-55129 Mainz)" oninput="updateAddress()" />
    
    <div id="printSection">
      <div class="barcode-container">
        <svg id="barcode"></svg>
        <div class="address-block" id="addressBlock">
          <div id="nameOutput">Stefan Eimer</div>
          <div id="companyOutput">Löwen Techniker</div>
          <div id="streetOutput">Bodenheimerstr. 12</div>
          <div id="cityOutput">DE-55129 Mainz</div>
        </div>
      </div>
    </div>
    
    <textarea class="manual-note" id="manualNote" placeholder="Zusätzliche Notizen (nur für Bildschirmanzeige)"></textarea>
    <button onclick="window.print()">Drucken</button>
  </main>
  <script>
    // Initialen Barcode generieren
    window.onload = function() {
      document.getElementById("barcodeInput").value = "116319_MDXKGE_SD";
      generateBarcode();
    };
    
    function generateBarcode() {
      const input = document.getElementById("barcodeInput").value;
      const svg = document.getElementById("barcode");
      if (input.trim() === "") {
        svg.innerHTML = "";
        return;
      }
      try {
        JsBarcode("#barcode", input, {
          format: "CODE128",
          displayValue: true,
          fontSize: 18,
          lineColor: "#000",
          width: 2.5,
          height: 70,
          margin: 0,
          marginTop: 5,
          marginBottom: 5
        });
      } catch (e) {
        svg.innerHTML = "";
        console.error("Barcode-Fehler:", e);
      }
    }
    
    function updateAddress() {
      const name = document.getElementById("nameInput").value || "Stefan Eimer";
      const company = document.getElementById("companyInput").value || "Löwen Techniker";
      const street = document.getElementById("streetInput").value || "Bodenheimerstr. 12";
      const city = document.getElementById("cityInput").value || "DE-55129 Mainz";
      
      document.getElementById("nameOutput").textContent = name;
      document.getElementById("companyOutput").textContent = company;
      document.getElementById("streetOutput").textContent = street;
      document.getElementById("cityOutput").textContent = city;
    }
  </script>
</body>
</html>
